AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Globetrekker bootstrap (deploy ONCE, by hand, with admin credentials). Lets GitHub Actions
  authenticate to AWS with OIDC (no stored AWS keys) through two narrowly scoped roles:
  an infra role that creates/updates the app stack (infra.yml) and a deploy role that ships
  releases to it (ci-cd.yml). See infra/cloudformation/README.md and _docs/deployment.md.

Parameters:
  GitHubOrg:
    Type: String
    Default: sushantmagoo
    Description: GitHub user or organisation that owns the repository.
  GitHubRepo:
    Type: String
    Default: globetrekker
  DefaultBranch:
    Type: String
    Default: main
  ProjectName:
    Type: String
    Default: globetrekker
    AllowedPattern: ^[a-z][a-z0-9-]{2,20}$
    Description: Prefix for every resource the app stack creates. Must match app.yaml's ProjectName.
  AppStackName:
    Type: String
    Default: globetrekker-app
    Description: Name of the app stack infra.yml deploys (the only stack the infra role may touch).
  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      An AWS account can only have one GitHub OIDC provider. Set to 'false' if
      token.actions.githubusercontent.com is already registered in this account.

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # Upper bound on what any role created by the infra role can ever do. The infra role can
  # only create/modify roles that carry this boundary, so a malicious template change can't
  # mint an admin role for the EC2 instance.
  InstanceBoundaryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${ProjectName}-instance-boundary
      Description: Permissions boundary for roles created by the Globetrekker infra role.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SsmAgent
            Effect: Allow
            Action:
              - ssm:UpdateInstanceInformation
              - ssm:ListInstanceAssociations
              - ssm:DescribeAssociation
              - ssm:GetDocument
              - ssm:DescribeDocument
              - ssm:GetManifest
              - ssm:PutInventory
              - ssm:PutComplianceItems
              - ssm:PutConfigurePackageResult
              - ssm:UpdateAssociationStatus
              - ssm:UpdateInstanceAssociationStatus
              - ssm:GetDeployablePatchSnapshotForInstance
              - ssmmessages:*
              - ec2messages:*
            Resource: '*'
          - Sid: ReadAppSecrets
            Effect: Allow
            Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
            Resource: !Sub arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/${ProjectName}/*
          - Sid: DecryptSecureStrings
            Effect: Allow
            Action: kms:Decrypt
            Resource: '*'
            Condition:
              StringLike:
                kms:ViaService: ssm.*.amazonaws.com
          - Sid: PullImages
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchCheckLayerAvailability
            Resource: '*'
          - Sid: ReadReleaseBundles
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${ProjectName}-releases-*/*
          - Sid: Logs
            Effect: Allow
            Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
            Resource: '*'

  # ---------- Infra role: used by .github/workflows/infra.yml ----------
  GitHubInfraRole:
    Type: AWS::IAM::Role
    Properties:
      # Deliberately NOT prefixed with ProjectName, so the infra role (which may manage
      # roles named "<ProjectName>-*") can never modify itself or the deploy role.
      RoleName: !Sub github-actions-${ProjectName}-infra
      Description: !Sub GitHub Actions (${GitHubOrg}/${GitHubRepo}, environment "infrastructure") creates/updates the ${AppStackName} stack.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: [sts:AssumeRoleWithWebIdentity, sts:TagSession]
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}*/${GitHubRepo}*:environment:infrastructure
      Policies:
        - PolicyName: manage-app-stack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AppStackOnly
                Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*
              - Sid: TemplateHelpers
                Effect: Allow
                Action: [cloudformation:ValidateTemplate, cloudformation:GetTemplateSummary]
                Resource: '*'
              - Sid: Networking
                # EC2 actions are hard to scope per resource; limited to this region instead.
                Effect: Allow
                Action: ec2:*
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Sid: ResolveAmiParameter
                Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/service/ami-amazon-linux-latest/*
              - Sid: AppParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:PutParameter
                  - ssm:AddTagsToResource
                  - ssm:DescribeParameters
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/*
              - Sid: DescribeParameters
                Effect: Allow
                Action: ssm:DescribeParameters
                Resource: '*'
              - Sid: Ecr
                Effect: Allow
                Action: ecr:*
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}-*
              - Sid: EcrDescribe
                Effect: Allow
                Action: [ecr:DescribeRepositories, ecr:GetAuthorizationToken]
                Resource: '*'
              - Sid: ReleaseBucket
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${ProjectName}-releases-*
                  - !Sub arn:${AWS::Partition}:s3:::${ProjectName}-releases-*/*
              - Sid: CreateBoundedRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:PutRolePermissionsBoundary
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref InstanceBoundaryPolicy
              - Sid: ManageOwnRoles
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:DeleteRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*
              - Sid: InstanceProfiles
                Effect: Allow
                Action:
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:TagInstanceProfile
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/${ProjectName}-*
              - Sid: PassInstanceRoleToEc2Only
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com
              - Sid: NeverRemoveBoundaries
                Effect: Deny
                Action: iam:DeleteRolePermissionsBoundary
                Resource: '*'

  # ---------- Deploy role: used by .github/workflows/ci-cd.yml ----------
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub github-actions-${ProjectName}-deploy
      Description: !Sub GitHub Actions (${GitHubOrg}/${GitHubRepo}, environment "production") pushes images and deploys releases.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: [sts:AssumeRoleWithWebIdentity, sts:TagSession]
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}*/${GitHubRepo}*:environment:production
                  - !Sub repo:${GitHubOrg}*/${GitHubRepo}*:ref:refs/heads/${DefaultBranch}
      Policies:
        - PolicyName: push-images-and-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: PushImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeImages
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}-*
              - Sid: UploadReleaseBundles
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub arn:${AWS::Partition}:s3:::${ProjectName}-releases-*/releases/*
              - Sid: ListReleaseBundles
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${ProjectName}-releases-*
              - Sid: SendCommandToAppInstanceOnly
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ssm:resourceTag/Name: !Sub ${ProjectName}-app
              - Sid: SendCommandUsingRunShellScriptOnly
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Sid: ReadCommandResults
                Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: '*'
              - Sid: ReadAppStackOutputs
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*

Outputs:
  InfraRoleArn:
    Description: GitHub repository variable AWS_INFRA_ROLE_ARN
    Value: !GetAtt GitHubInfraRole.Arn
  DeployRoleArn:
    Description: GitHub repository variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
  InstanceBoundaryPolicyArn:
    Value: !Ref InstanceBoundaryPolicy
