[project]
name = "globetrekker-oncall-agent"
version = "0.1.0"
description = "Wakes up on Grafana alerts, collects evidence from Prometheus/Loki/Tempo and runs a headless coding agent to fix the issue"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S603", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
