name: CI/CD

# Tests every PR; on main also builds images, pushes them to ECR and deploys to EC2.
# See _docs/testing.md, _docs/deployment.md and _docs/release-process.md.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Redeploy (roll back to) an earlier release by commit SHA. Leave empty to test, build and deploy the current commit.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  STACK_NAME: globetrekker-app
  IS_ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha != '' }}

jobs:
  # ---------- 1. Fast checks (parallel) ----------
  backend:
    name: Backend lint + unit tests
    if: github.event_name != 'workflow_dispatch' || inputs.release_sha == ''
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: be } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, cache-dependency-glob: be/uv.lock }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest tests/unit -q

  frontend:
    name: Frontend lint + unit tests + build
    if: github.event_name != 'workflow_dispatch' || inputs.release_sha == ''
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: fe } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: fe/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # ---------- 2. Integration: API + real Postgres 18 ----------
  integration:
    name: Backend integration tests (Postgres)
    needs: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: globetrekker_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults: { run: { working-directory: be } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, cache-dependency-glob: be/uv.lock }
      - run: uv sync --frozen
      - name: pytest tests/integration
        run: uv run pytest tests/integration -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/globetrekker_test

  # ---------- On-call agent: lint + tests (fake backends, fake coding agent) ----------
  oncall-agent:
    name: On-call agent (lint + tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: oncall-agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, cache-dependency-glob: oncall-agent/uv.lock }
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q

  # ---------- 3. End-to-end: real browser against the Docker stack ----------
  e2e:
    name: End-to-end tests (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      RATE_LIMIT_ENABLED: 'false' # tests sign up many users
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack (docker compose, dev targets)
        run: docker compose up -d --build
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: e2e/package-lock.json }
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run e2e tests
        working-directory: e2e
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: e2e/playwright-report, retention-days: 7 }
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # ---------- 4. Build & push images (main only) ----------
  images:
    name: Build and push images
    needs: [frontend, integration, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.release_sha == '')
    runs-on: ubuntu-latest
    # No `environment` here, so a required-reviewer gate on "production" asks only once (deploy job).
    permissions: { id-token: write, contents: read }
    outputs:
      registry: ${{ steps.stack.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read stack outputs
        id: stack
        run: |
          REGISTRY=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='EcrRegistry'].OutputValue" --output text)
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: be
          target: prod
          push: true
          tags: ${{ steps.stack.outputs.registry }}/globetrekker-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: fe
          target: prod
          push: true
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_PUBLIC_APP_URL=${{ vars.APP_URL || 'https://globetrekker.me' }}
          tags: ${{ steps.stack.outputs.registry }}/globetrekker-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ---------- 5. Deploy to EC2 via SSM (main only; also used for rollbacks) ----------
  deploy:
    name: Deploy to EC2
    needs: [images]
    if: >-
      !cancelled() && !failure() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions: { id-token: write, contents: read }
    env:
      RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.release_sha || github.sha }}' }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read stack outputs
        id: stack
        run: |
          OUT=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs')
          get() { jq -r --arg k "$1" '.[] | select(.OutputKey==$k) | .OutputValue' <<<"$OUT"; }
          for key in InstanceId EcrRegistry ReleaseBucket SsmPrefix; do
            value=$(get "$key")
            [ -n "$value" ] && [ "$value" != "null" ] || { echo "::error::Stack output $key missing - run the Infrastructure workflow first"; exit 1; }
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Upload release bundle
        env:
          BUCKET: ${{ steps.stack.outputs.ReleaseBucket }}
        run: |
          KEY="releases/$RELEASE_SHA.tar.gz"
          if [ "$IS_ROLLBACK" = "true" ]; then
            echo "Rollback: reusing bundle s3://$BUCKET/$KEY"
            aws s3api head-object --bucket "$BUCKET" --key "$KEY" >/dev/null \
              || { echo "::error::No release bundle for $RELEASE_SHA (was it ever deployed?)"; exit 1; }
          else
            tar -czf /tmp/bundle.tar.gz docker-compose.yml docker-compose.prod.yml docker-compose.observability.yml \
              observability Caddyfile deploy/remote-deploy.sh
            aws s3 cp /tmp/bundle.tar.gz "s3://$BUCKET/$KEY"
          fi

      - name: Deploy via SSM Run Command
        env:
          INSTANCE_ID: ${{ steps.stack.outputs.InstanceId }}
          REGISTRY: ${{ steps.stack.outputs.EcrRegistry }}
          BUCKET: ${{ steps.stack.outputs.ReleaseBucket }}
          SSM_PREFIX: ${{ steps.stack.outputs.SsmPrefix }}
        run: |
          DIR="/opt/globetrekker/releases/$RELEASE_SHA"
          PARAMS=$(jq -n \
            --arg dir "$DIR" --arg sha "$RELEASE_SHA" --arg bucket "$BUCKET" \
            --arg region "$AWS_REGION" --arg registry "$REGISTRY" --arg prefix "$SSM_PREFIX" \
            '{commands: [
              "set -euo pipefail",
              "mkdir -p \($dir)",
              "aws s3 cp s3://\($bucket)/releases/\($sha).tar.gz /tmp/release.tar.gz --region \($region) --only-show-errors",
              "tar -xzf /tmp/release.tar.gz -C \($dir)",
              "AWS_REGION=\($region) ECR_REGISTRY=\($registry) SSM_PREFIX=\($prefix) bash \($dir)/deploy/remote-deploy.sh \($sha)"
            ], executionTimeout: ["1200"]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "globetrekker deploy $RELEASE_SHA" \
            --parameters "$PARAMS" --query 'Command.CommandId' --output text)
          echo "SSM command: $COMMAND_ID"

          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy failed on the instance ($STATUS). The previous release was restored if there was one."
            exit 1
          fi

      - name: Public health check
        if: vars.APP_URL != ''
        run: |
          for _ in $(seq 1 18); do
            curl -fsS "${{ vars.APP_URL }}/api/ready" && { echo; echo "Healthy: ${{ vars.APP_URL }}"; exit 0; }
            sleep 10
          done
          echo "::error::${{ vars.APP_URL }}/api/ready did not become healthy"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy"
            echo "- Release: \`$RELEASE_SHA\`$([ "$IS_ROLLBACK" = "true" ] && echo ' (rollback)')"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
