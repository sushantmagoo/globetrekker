name: Infrastructure

# Creates and updates the AWS environment (infra/cloudformation/app.yaml) and its secrets.
# One-time prerequisite: the bootstrap stack + GitHub environments (see _docs/deployment.md).

on:
  pull_request:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: infra # never run two infrastructure changes at once
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  STACK_NAME: globetrekker-app
  SSM_PREFIX: /globetrekker/prod

jobs:
  validate:
    name: Validate templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: cfn-lint
        run: uvx cfn-lint infra/cloudformation/*.yaml

  deploy:
    name: Create / update AWS stack
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: infrastructure
    permissions:
      id-token: write # OIDC → short-lived AWS credentials, no stored keys
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure app secrets exist in Parameter Store
        env:
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
        run: |
          # Secrets are generated once, on AWS, and never pass through GitHub. They are NOT
          # rotated on later runs: changing POSTGRES_PASSWORD would lock the app out of an
          # existing database (rotation is a manual, documented procedure).
          ensure_secret() {
            if ! aws ssm get-parameter --name "$SSM_PREFIX/$1" >/dev/null 2>&1; then
              aws ssm put-parameter --name "$SSM_PREFIX/$1" --type SecureString \
                --value "$(openssl rand -hex 32)" >/dev/null
              echo "Created $SSM_PREFIX/$1"
            else
              echo "Kept existing $SSM_PREFIX/$1"
            fi
          }
          ensure_secret POSTGRES_PASSWORD
          ensure_secret JWT_SECRET

          if [ -z "$ACME_EMAIL" ]; then
            echo "::error::Set the repository variable ACME_EMAIL (Let's Encrypt contact address)"
            exit 1
          fi
          aws ssm put-parameter --name "$SSM_PREFIX/ACME_EMAIL" --type String \
            --value "$ACME_EMAIL" --overwrite >/dev/null

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/cloudformation/app.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              InstanceType="${{ vars.INSTANCE_TYPE || 't3.small' }}" \
              DataVolumeSize="${{ vars.DATA_VOLUME_SIZE || '20' }}" \
            --tags Project=globetrekker ManagedBy=github-actions

      - name: Show stack outputs
        if: always()
        run: |
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query 'Stacks[0].[StackStatus, Outputs]' --output table || true
          IP=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='PublicIp'].OutputValue" --output text 2>/dev/null || true)
          {
            echo "### Infrastructure"
            echo "- Stack: \`$STACK_NAME\` in \`$AWS_REGION\`"
            echo "- Elastic IP: \`${IP:-n/a}\` → point the \`A\` records for \`globetrekker.me\` and \`www.globetrekker.me\` here"
          } >> "$GITHUB_STEP_SUMMARY"
